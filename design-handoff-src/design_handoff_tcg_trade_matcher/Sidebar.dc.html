<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:240px;height:100%;box-sizing:border-box;background:#11141C;border-right:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;gap:24px;padding:20px 16px;font-family:Geist,sans-serif">
<div style="display:flex;align-items:center;gap:10px;padding:0 8px">
<dc-import name="Mascot" mood="curious" size="28" color="{{ mc }}" hint-size="28px,30px"></dc-import>
<div style="display:flex;flex-direction:column;line-height:1.05"><span style="font-weight:700;font-size:15px;color:#F4F5F8;letter-spacing:-0.01em">Trade Matcher</span><span style="font-size:10px;color:#8B93A7;letter-spacing:0.08em;text-transform:uppercase">for TCG collectors</span></div>
</div>
<div style="display:flex;align-items:center;justify-content:center;gap:8px;height:40px;border-radius:12px;background:linear-gradient(90deg,#6C63FF,#A66CFF);color:#fff;font-weight:500;font-size:14px;box-shadow:0 6px 20px rgba(108,99,255,0.3)"><dc-import name="Icon" icon-name="plus" size="16" color="#fff" hint-size="16px,16px"></dc-import>Add Card</div>
<div style="display:flex;flex-direction:column;gap:2px">
<sc-for list="{{ primary }}" as="it" hint-placeholder-count="5">
<div style="display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:10px;background:{{ it.bg }};color:{{ it.fg }};font-size:14px;font-weight:500;box-shadow:{{ it.ring }}">
<dc-import name="Icon" icon-name="{{ it.icon }}" size="18" color="{{ it.ic }}" hint-size="18px,18px"></dc-import>
<span style="flex:1">{{ it.label }}</span>
<sc-if value="{{ it.badge }}" hint-placeholder-val="{{ false }}"><span style="min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:999px;background:#6C63FF;color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center">{{ it.badge }}</span></sc-if>
</div>
</sc-for>
</div>
<div style="height:1px;background:rgba(255,255,255,0.06);margin:0 8px"></div>
<div style="display:flex;flex-direction:column;gap:2px">
<sc-for list="{{ secondary }}" as="it" hint-placeholder-count="3">
<div style="display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:10px;background:{{ it.bg }};color:{{ it.fg }};font-size:14px;font-weight:500;box-shadow:{{ it.ring }}">
<dc-import name="Icon" icon-name="{{ it.icon }}" size="18" color="{{ it.ic }}" hint-size="18px,18px"></dc-import>
<span style="flex:1">{{ it.label }}</span>
<sc-if value="{{ it.badge }}" hint-placeholder-val="{{ false }}"><span style="min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:999px;background:#1D2330;color:#C9CEDB;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center">{{ it.badge }}</span></sc-if>
</div>
</sc-for>
</div>
<div style="flex:1"></div>
<div style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:#171B25;border:1px solid rgba(255,255,255,0.06)">
<div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#FF8A7A,#A66CFF);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:13px">A</div>
<div style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:0"><span style="font-size:13px;font-weight:600;color:#F4F5F8">Aisyah R.</span><span style="font-size:11px;color:#42D9E8;display:flex;align-items:center;gap:4px"><dc-import name="Icon" icon-name="badge" size="12" color="#42D9E8" hint-size="12px,12px"></dc-import>Identity Verified</span></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:760},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Discover&quot;,&quot;Collection&quot;,&quot;Wants&quot;,&quot;Matches&quot;,&quot;Trades&quot;,&quot;Messages&quot;,&quot;Profile&quot;,&quot;Settings&quot;],&quot;default&quot;:&quot;Matches&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mascotColor&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;indigo&quot;,&quot;violet&quot;,&quot;cyan&quot;,&quot;coral&quot;],&quot;default&quot;:&quot;indigo&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? "Matches";
    const mk = (label, icon, badge) => {
      const on = label === a;
      return { label, icon, badge: badge || false, bg: on ? "rgba(108,99,255,0.14)" : "transparent", fg: on ? "#F4F5F8" : "#A3AABB", ic: on ? "#8F88FF" : "#8B93A7", ring: on ? "inset 0 0 0 1px rgba(108,99,255,0.35)" : "none" };
    };
    return {
      mc: this.props.mascotColor ?? "indigo",
      primary: [mk("Discover", "compass"), mk("Collection", "library"), mk("Wants", "heart"), mk("Matches", "sparkles", "12"), mk("Trades", "swap")],
      secondary: [mk("Messages", "message", "3"), mk("Profile", "user"), mk("Settings", "sliders")]
    };
  }
}
</script>
</body>
</html>
